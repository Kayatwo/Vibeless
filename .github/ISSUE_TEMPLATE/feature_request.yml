name: Feature request
description: Suggest something Vibeless should do.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Vibeless keeps the original 1.4.4 mechanics as the default: gameplay changes
        are best proposed as a separately enabled package or setting.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is it?
      options:
        - Foundation (runtime, services, package contracts)
        - Content package
        - Setting for existing behaviour
        - Tooling or documentation
        - Not sure
    validations:
      required: true
