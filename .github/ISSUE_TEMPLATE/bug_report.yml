name: Bug report
description: Something in Vibeless does not work as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Security problem?** Do not use this form. Report it privately: https://github.com/Kayatwo/Vibeless/security/advisories/new

        **Before you paste logs:** remove account keys, tokens, `.env` values and anything else secret. Never attach game files.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed keys, tokens, `.env` values and other private data from everything below.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Which part is affected?
      options:
        - Native runtime (UndauntedInternalServer)
        - Feature host or a native feature
        - Compatibility check (client or server)
        - Metagame (backend)
        - Deploy server
        - Foundation bundle or CI
        - Inherited upstream part (launcher, server kit, docs site)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Include any error message exactly as it appeared.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step? Did it happen once or every time?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or bundle version
      description: The commit you built (`git rev-parse --short HEAD`), or `version` from the bundle's foundation-manifest.json.
      placeholder: e.g. 0.1.0+0c4443198fd0
    validations:
      required: true
  - type: textarea
    id: reports
    attributes:
      label: Runtime reports and logs
      description: If relevant, the profile's reports/runtime-*.json and the lines of the service logs around the problem (secrets removed).
      render: text
